# Echoes of Aincrad. DATA only; core never branches on the title.
#
# The title is *Echoes of Aincrad* (Steam 2244210, Game Studio Inc. / Bandai
# Namco, released 2026-07-09, Unreal Engine 5) — the exact name, not "Echo of".
#
# Zones below are measured, not guessed: every rectangle comes from a live run on
# a 1920x1080 frame (`screencheck --chain 19,20,19`), so they are fractions of the
# frame rather than pixels. A pixel count would only be right on the screen it
# was measured on.
#
# The `glyph_band` zone is the one that earns this file. The boss bar on ws20 is
# not text: the recogniser reads the runes as `LIUITEQI` and
# `TU-LIOL+EGI IHVIAAITIKLLALT FDEBUI-A`, every one of those tokens has vowels,
# so no amount of Latin-noise filtering catches them - and the backend
# transliterates them into cards on top of the runes. What is inside is symbols,
# and that is a fact about this game, so it lives here and not in core.
id = "echoes_of_aincrad"
lexicon_pack = "echoes_of_aincrad"
enable_game_glossary = true
preferred_ocr = ["rapid", "tesseract"]
dialogue_prior = "gameplay HUD: objective, pickups, enemy name, interaction prompt"
font_hint = ""

[speaker]
enabled = false
gap_min_px = 16.0
gap_glyph_mult = 1.5

[timeouts]
interval_sub = 0.28

# Combat state, top left. Measured: "In Combat" at (29,215) 85x17.
[[ui_zones]]
name = "combat_state"
x = 0.005
y = 0.17
w = 0.22
h = 0.10
unit = "frac"

# Quest objective, right edge. Measured: "Search for Kirito" at (1528,237) 163x29.
[[ui_zones]]
name = "objective_line"
x = 0.74
y = 0.19
w = 0.25
h = 0.09
unit = "frac"

