# Глоссарий английского.
#
# Намеренно короткий. Русский словарь на 271 запись, и его писали по
# мере надобности, разбирая, как бэкенд калечит конкретные слова. English
# так не требует: большинство коротких UI-лейблов - это те же слова,
# только заглавными, и пустая запись честнее выдуманного перевода.
#
# Игровые термины отсутствуют: они либо остаются собой (имена,
# аббревиатуры), либо это работа бэкенда.

