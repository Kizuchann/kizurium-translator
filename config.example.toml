# Kizurium Translator — конфигурация.
# Путь: ~/.config/kizurium-translator/config.toml
# Ключи необязательны. Сеть и данные: docs/trust.md

[translation]
# Язык перевода. Основной пользователь проекта русскоязычный, поэтому ru.
target = "ru"
# auto — определять язык по тексту.
source = "auto"
# translate.googleapis.com (gtx), без API-ключа. При 429 — cooldown_s.
use_gtx = true
# Не создавать онлайн-бэкенды (нужен локальный language pack).
offline_only = false
# Запасные бэкенды (пакет deep-translator). Выключено по умолчанию.
allow_slow_translation = false
# Строки длиннее этого не переводятся.
max_chars = 4300
# Пауза после 429, секунд.
gtx_cooldown_s = 25.0
# Потолок кэша переводов; старые записи вытесняются.
cache_max_entries = 4000

# Словарь: применяется до обращения к сети. Сюда стоит класть игровые и
# продуктовые термины — встроенный словарь намеренно маленький.
[translation.glossary]
# Применяется до обращения к сети, поэтому такие строки не зависят от перевода.
# Встроенный словарь покрывает только общие слова интерфейса. Термины конкретной
# игры — сюда: они не имеют смысла на чужом экране, поэтому в умолчаниях их нет.
# "TIPS" = "Подсказка"
# "Gacha" = "Гача"
# "Rhodes Island" = "Rhodes Island"

[live]
# Период пере-OCR, пока область меняется, секунды.
interval = 0.55
# Быстрее для субтитров и диалога.
interval_sub = 0.28
# Реже на статичном UI, когда карточки уже на экране.
interval_ui_stable = 4.5
# Сколько секунд карточки скрыты перед снимком, чтобы OCR не читал сам себя.
hide_for_capture_s = 0.18
# Перечитывать только изменившуюся часть области, а не весь кадр.
# Заметно быстрее на субтитрах и диалогах, где меняются одна-две строки.
incremental = true
hide_for_sub_s = 0.10

[detection]
# Пороги разницы кадров: что считать изменением экрана.
change_mean = 10.0
change_mean_videoish = 20.0
change_tile = 2.15
change_center = 1.85
# Насколько два результата OCR должны совпадать, чтобы считаться одной строкой.
ocr_key_sim = 0.88
# Длинная сторона уменьшенной картинки для дешёвой проверки изменений.
# Меньше — быстрее и грубее.
probe_side = 320

[ocr]
# Порядок движков. Отсутствующие пропускаются автоматически.
#   rapid     — RapidOCR, быстрый, для латиницы и игр
#   meiki     — MeikiOCR, японский игровой UI
#   tesseract — всегда доступен как запасной
engines = ["rapid", "meiki", "tesseract"]
# Самая длинная сторона кадра, попадающая в OCR.
max_screenshot_side = 4672

[overlay]
# Цвет карточки и текста, 0..1.
card_bg = [0.05, 0.07, 0.12, 0.55]
card_fg = [1.0, 1.0, 1.0, 1.0]
# Скругление углов; рендер ограничивает его минимумом из 7 и min(w,h)/3.
card_radius = 7.0
# Обводка глифов для читаемости на светлом фоне.
card_outline = true

# Опциональный игровой профиль (DATA в data/profiles/<id>.toml).
# Пусто / отсутствует = универсальный режим без игровых подсказок.
# Env KIZURIUM_TRANSLATOR_PROFILE перекрывает этот ключ.
# [profile]
# id = "arknights"
